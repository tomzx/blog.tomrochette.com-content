<svg aria-labelledby="t" role="img" xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The author split in two</title>
  <desc>A stacked bar splitting writing into two halves. The mechanical half, words, sentence order, and register, is automated by the model. The judgment half, what is true, what to assert, and what to omit, stays with the author and is now the entire product.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="280" fill="#ffffff"/>
<text x="60" y="44" font-size="14" font-weight="bold" fill="#0f172a">Writing splits into two jobs</text>
<rect x="60" y="72" width="360.0" height="64" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<text x="240.0" y="99.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#0f172a">Mechanical half</text>
<text x="240.0" y="120.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#64748b">words, sentence order, register</text>
<rect x="420.0" y="72" width="440.0" height="64" rx="8" fill="#e7f6ed" stroke="#16a34a" stroke-width="1.5"/>
<text x="640.0" y="99.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#16a34a">Judgment half</text>
<text x="640.0" y="120.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#16a34a">what is true, what to assert, what to omit</text>
<line x1="240.0" y1="140" x2="240.0" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="240.0" y="200" text-anchor="middle" font-size="13" fill="#64748b">automated by the model</text>
<line x1="640.0" y1="140" x2="640.0" y2="176" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
<text x="640.0" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">stays with the author, and is now the entire product</text>
</svg>
