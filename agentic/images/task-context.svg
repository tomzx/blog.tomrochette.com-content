<svg viewBox="0 0 720 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">One task holds the sources, the checkout, and the runs</title>
  <desc id="d">Sources on the left (Slack threads, GitHub issues and pull requests, notes and paths) attach to a task in the middle. The task points to a worktree, an ACP harness, and a durable run queue on the right. Changes recorded between them feed autonomy rate and yield at the bottom.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#0f172a"] { fill: #e2e8f0; }
      [fill="#64748b"] { fill: #94a3b8; }
      [fill="#2563eb"] { fill: #60a5fa; }
      [fill="#f8fafc"] { fill: #1e293b; }
      [stroke="#cbd5e1"] { stroke: #475569; }
      [stroke="#2563eb"] { stroke: #60a5fa; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">One task holds the sources, the checkout, and the runs</text>
  <text x="24" y="52" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Agentic attaches the context of a piece of work to a single record.</text>

  <text x="24" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.08em">SOURCES</text>
  <text x="360" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.08em" text-anchor="middle">TRACKER</text>
  <text x="696" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.08em" text-anchor="end">EXECUTION</text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="24" y="104" width="160" height="44" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="40" y="131" font-size="13" fill="#0f172a">Slack thread</text>

    <rect x="24" y="156" width="160" height="44" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="40" y="183" font-size="13" fill="#0f172a">GitHub issue / PR</text>

    <rect x="24" y="208" width="160" height="44" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="40" y="235" font-size="13" fill="#0f172a">Notes, docs, paths</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="188" y1="126" x2="254" y2="126"/>
    <line x1="188" y1="178" x2="254" y2="178"/>
    <line x1="188" y1="230" x2="254" y2="230"/>
    <line x1="466" y1="126" x2="504" y2="126"/>
    <line x1="466" y1="178" x2="504" y2="178"/>
    <line x1="466" y1="230" x2="504" y2="230"/>
  </g>

  <rect x="260" y="96" width="206" height="168" rx="10" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.6"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="280" y="126" font-size="15" font-weight="600" fill="#2563eb">Task</text>
    <text x="280" y="152" font-size="12" fill="#0f172a">summary and next steps</text>
    <text x="280" y="174" font-size="12" fill="#0f172a">status, priority, deadline</text>
    <text x="280" y="196" font-size="12" fill="#0f172a">people and repositories</text>
    <text x="280" y="218" font-size="12" fill="#0f172a">timeline with client and actor</text>
    <text x="280" y="240" font-size="12" fill="#0f172a">position on the focus stack</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="510" y="104" width="186" height="44" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="526" y="131" font-size="13" fill="#0f172a">git worktree</text>

    <rect x="510" y="156" width="186" height="44" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="526" y="183" font-size="13" fill="#0f172a">ACP harness</text>

    <rect x="510" y="208" width="186" height="44" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="526" y="235" font-size="13" fill="#0f172a">durable run queue</text>
  </g>

  <line x1="363" y1="264" x2="363" y2="282" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="260" y="288" width="436" height="42" rx="8" fill="#f8fafc" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="280" y="314" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">Changes recorded from this work feed autonomy rate and yield.</text>
</svg>
