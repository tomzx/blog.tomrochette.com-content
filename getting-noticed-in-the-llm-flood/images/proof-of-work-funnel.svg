<svg aria-labelledby="t" role="img" xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The proof-of-work funnel for published claims</title>
  <desc>Every published claim enters a filter. Claims with a verification surface trace to records such as commit history, incident reports, or people who remember the work, and earn trust. Claims with nothing to check are assumed generated and skipped.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#ffffff"] { fill: #1b2029; }  /* cards, boxes */
      rect.svg-canvas { fill: #14191f; }  /* full canvas */
      [fill="#0f172a"] { fill: #e2e8f0; }
      [fill="#16a34a"] { fill: #4ade80; }
      rect[fill="#16a34a"],circle[fill="#16a34a"],ellipse[fill="#16a34a"],path[fill="#16a34a"],polygon[fill="#16a34a"] { fill: #22a55a; }  /* keep white foreground */
      [fill="#64748b"] { fill: #94a3b8; }
      [fill="#dc2626"] { fill: #f87171; }
      rect[fill="#dc2626"],circle[fill="#dc2626"],ellipse[fill="#dc2626"],path[fill="#dc2626"],polygon[fill="#dc2626"] { fill: #d94f4f; }  /* keep white foreground */
      [fill="#e7f6ed"] { fill: #122419; }
      [fill="#e9effd"] { fill: #17233a; }
      [fill="#fbe9e9"] { fill: #2a1a1a; }
      [stroke="#16a34a"] { stroke: #4ade80; }
      [stroke="#2563eb"] { stroke: #60a5fa; }
      [stroke="#dc2626"] { stroke: #f87171; }
    }
  </style>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
  <rect class="svg-canvas" x="0" y="0" width="920" height="390" fill="#ffffff"/>
<text x="460" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Every claim you publish</text>
<path d="M 300 60 L 620 60 L 500 148 L 500 190 L 420 190 L 420 148 Z" fill="#e9effd" stroke="#2563eb" stroke-width="1.5"/>
<text x="460" y="130" text-anchor="middle" font-size="12" fill="#64748b">readers check what can be checked</text>
<line x1="420" y1="190" x2="254" y2="250" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrRed)"/>
<rect x="60" y="254" width="380" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<rect x="60" y="254" width="380" height="34" rx="8" fill="#fbe9e9" stroke="#dc2626" stroke-width="1.5"/>
<rect x="61" y="280" width="378" height="8" fill="#fbe9e9" stroke="none"/>
<text x="250.0" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Nothing to check</text>
<circle cx="78" cy="306" r="2.5" fill="#dc2626"/>
<text x="88" y="310.0" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">Assumed generated. Skipped.</text>
<line x1="500" y1="190" x2="666" y2="250" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
<rect x="480" y="254" width="380" height="108" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<rect x="480" y="254" width="380" height="34" rx="8" fill="#e7f6ed" stroke="#16a34a" stroke-width="1.5"/>
<rect x="481" y="280" width="378" height="8" fill="#e7f6ed" stroke="none"/>
<text x="670.0" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">A verification surface</text>
<circle cx="498" cy="306" r="2.5" fill="#16a34a"/>
<text x="508" y="310.0" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">Traces to the repository and commit</text>
<text x="508" y="328.9" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">history, an incident report or dataset, or</text>
<text x="508" y="347.7" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">people who remember the work.</text>
<circle cx="498" cy="353.7" r="2.5" fill="#16a34a"/>
<text x="508" y="357.7" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">The record holds up. Trust.</text>
</svg>
