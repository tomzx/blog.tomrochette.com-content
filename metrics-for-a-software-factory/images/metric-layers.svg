<svg viewBox="0 0 880 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mt md">
  <title id="mt">The metric layers of a software factory</title>
  <desc id="md">Four metric layers under one objective. The objective is autonomous work that survives its guardrails. Two primary metrics move autonomy and yield; two supporting metrics move throughput and unit cost; a dashed band holds the guardrails flat; a bottom row lists the leading indicators that steer the rest.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="440" y="46" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">The metric layers of a software factory</text>
    <text x="440" y="74" font-size="12.5" fill="#64748b" text-anchor="middle">Move the top pair, hold the guardrail, steer the bottom row</text>

    <!-- Objective -->
    <rect x="40" y="98" width="800" height="64" rx="14" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="124" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" letter-spacing="2">OBJECTIVE</text>
    <text x="440" y="148" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Autonomous work that survives its guardrails</text>
    <line x1="440" y1="164" x2="440" y2="184" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>

    <!-- Primary metrics -->
    <text x="40" y="208" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="2">MOVE</text>
    <line x1="100" y1="204" x2="840" y2="204" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="40" y="216" width="392" height="126" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="70" cy="252" r="5" fill="#2563eb"/>
    <text x="86" y="258" font-size="17" font-weight="600" fill="#1d4ed8">Autonomy rate</text>
    <text x="68" y="292" font-size="12.5" fill="#475569">share of accepted changes that reach production</text>
    <text x="68" y="312" font-size="12.5" fill="#475569">with no human involved</text>
    <text x="68" y="334" font-size="10.5" fill="#94a3b8">no question, correction, manual fix, rerun, or approval</text>

    <rect x="448" y="216" width="392" height="126" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="478" cy="252" r="5" fill="#2563eb"/>
    <text x="494" y="258" font-size="17" font-weight="600" fill="#1d4ed8">Yield</text>
    <text x="476" y="292" font-size="12.5" fill="#475569">share of autonomous output that survives</text>
    <text x="476" y="312" font-size="12.5" fill="#475569">verification, merge, and the post-release window</text>
    <text x="476" y="334" font-size="10.5" fill="#94a3b8">passes, stays merged, works in production</text>

    <line x1="440" y1="344" x2="440" y2="364" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>

    <!-- Supporting metrics -->
    <text x="40" y="390" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">SUPPORTING</text>
    <line x1="156" y1="386" x2="840" y2="386" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="40" y="398" width="392" height="108" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="68" y="436" font-size="16" font-weight="600" fill="#334155">Throughput</text>
    <text x="68" y="470" font-size="12.5" fill="#64748b">lead time, deployment frequency, queue depth</text>
    <text x="68" y="490" font-size="12.5" fill="#64748b">the DORA speed axis, read second</text>

    <rect x="448" y="398" width="392" height="108" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="476" y="436" font-size="16" font-weight="600" fill="#334155">Unit cost</text>
    <text x="476" y="470" font-size="12.5" fill="#64748b">cost per accepted change</text>
    <text x="476" y="490" font-size="12.5" fill="#64748b">human minutes per accepted change</text>

    <line x1="440" y1="508" x2="440" y2="528" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>

    <!-- Guardrails -->
    <text x="40" y="552" font-size="11" font-weight="700" fill="#b45309" letter-spacing="2">HOLD</text>
    <line x1="100" y1="548" x2="840" y2="548" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="40" y="560" width="800" height="60" rx="14" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="440" y="590" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="middle">Guardrails: change failure rate, defect escape rate, rework rate</text>
    <text x="440" y="610" font-size="11" fill="#64748b" text-anchor="middle">a key result is invalid if it can be met by shipping worse work</text>

    <!-- Leading indicators -->
    <text x="40" y="642" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">STEER</text>
    <line x1="108" y1="638" x2="840" y2="638" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="40" y="650" width="188" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="134" y="678" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Spec coverage</text>
    <text x="134" y="698" font-size="10" fill="#64748b" text-anchor="middle">outcomes with a verifier</text>

    <rect x="244" y="650" width="188" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="338" y="678" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Gate coverage</text>
    <text x="338" y="698" font-size="10" fill="#64748b" text-anchor="middle">independent checks per change</text>

    <rect x="448" y="650" width="188" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="542" y="678" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Context readiness</text>
    <text x="542" y="698" font-size="10" fill="#64748b" text-anchor="middle">a cold session finds the sources</text>

    <rect x="652" y="650" width="188" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="746" y="678" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Failure to gate</text>
    <text x="746" y="698" font-size="10" fill="#64748b" text-anchor="middle">escaped defects become checks</text>
  </g>
</svg>
