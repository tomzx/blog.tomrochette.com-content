<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Helvetica, Arial, sans-serif">
  <title>Splitting one whole-system on-call rotation into two per-area rotations</title>
  <desc>
    Left: six engineers, E1 through E6, all feed into one rotation that covers the whole system, and every primary must know all eight services.
    Right: the same six engineers are split into two three-person rotations, rotation A covering area A with four services and rotation B covering area B with the other four, with a dashed cross-area escalation path between the two areas.
    The left side is annotated primary every six weeks, must know all of it; the right side is annotated primary every three weeks, half the system.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5471f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>

  <text x="240" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Today: one shared rotation</text>
  <text x="675" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Proposed: a rotation per area</text>

  <line x1="460" y1="30" x2="460" y2="370" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- Left: six engineers, one rotation, whole system -->
  <g stroke="#2f2f2f" stroke-width="1.5" fill="#ffffff">
    <circle cx="75" cy="105" r="20"/>
    <circle cx="141" cy="105" r="20"/>
    <circle cx="207" cy="105" r="20"/>
    <circle cx="273" cy="105" r="20"/>
    <circle cx="339" cy="105" r="20"/>
    <circle cx="405" cy="105" r="20"/>
  </g>
  <g font-size="11" font-weight="600" fill="#222" text-anchor="middle">
    <text x="75" y="109">E1</text>
    <text x="141" y="109">E2</text>
    <text x="207" y="109">E3</text>
    <text x="273" y="109">E4</text>
    <text x="339" y="109">E5</text>
    <text x="405" y="109">E6</text>
  </g>

  <g stroke="#4a4a4a" stroke-width="1.3">
    <line x1="75" y1="129" x2="75" y2="194" marker-end="url(#arrow)"/>
    <line x1="141" y1="129" x2="141" y2="194" marker-end="url(#arrow)"/>
    <line x1="207" y1="129" x2="207" y2="194" marker-end="url(#arrow)"/>
    <line x1="273" y1="129" x2="273" y2="194" marker-end="url(#arrow)"/>
    <line x1="339" y1="129" x2="339" y2="194" marker-end="url(#arrow)"/>
    <line x1="405" y1="129" x2="405" y2="194" marker-end="url(#arrow)"/>
  </g>

  <rect x="50" y="200" width="380" height="130" rx="10" fill="#f0f4f9" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="240" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">the whole system</text>
  <g fill="#e3eaf3" stroke="#9fb2c8" stroke-width="1">
    <rect x="69" y="240" width="78" height="26" rx="4"/>
    <rect x="157" y="240" width="78" height="26" rx="4"/>
    <rect x="245" y="240" width="78" height="26" rx="4"/>
    <rect x="333" y="240" width="78" height="26" rx="4"/>
    <rect x="69" y="276" width="78" height="26" rx="4"/>
    <rect x="157" y="276" width="78" height="26" rx="4"/>
    <rect x="245" y="276" width="78" height="26" rx="4"/>
    <rect x="333" y="276" width="78" height="26" rx="4"/>
  </g>
  <g font-size="10" fill="#33506e" text-anchor="middle">
    <text x="108" y="257">auth</text>
    <text x="196" y="257">web</text>
    <text x="284" y="257">data</text>
    <text x="372" y="257">infra</text>
    <text x="108" y="293">payments</text>
    <text x="196" y="293">search</text>
    <text x="284" y="293">batch</text>
    <text x="372" y="293">ops</text>
  </g>

  <text x="240" y="358" text-anchor="middle" font-size="12.5" fill="#a12622">primary every 6 weeks, must know all of it</text>
  <text x="240" y="376" text-anchor="middle" font-size="11" font-style="italic" fill="#a12622" opacity="0.85">context decays for 5 weeks between shifts</text>

  <!-- Right: two rotations, one per area -->
  <g stroke="#2f2f2f" stroke-width="1.5" fill="#ffffff">
    <circle cx="500" cy="105" r="18"/>
    <circle cx="551" cy="105" r="18"/>
    <circle cx="602" cy="105" r="18"/>
    <circle cx="748" cy="105" r="18"/>
    <circle cx="799" cy="105" r="18"/>
    <circle cx="850" cy="105" r="18"/>
  </g>
  <g font-size="11" font-weight="600" fill="#222" text-anchor="middle">
    <text x="500" y="109">E1</text>
    <text x="551" y="109">E2</text>
    <text x="602" y="109">E3</text>
    <text x="748" y="109">E4</text>
    <text x="799" y="109">E5</text>
    <text x="850" y="109">E6</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="551" y="145">rotation A</text>
    <text x="799" y="145">rotation B</text>
  </g>

  <g stroke="#4a4a4a" stroke-width="1.3">
    <line x1="500" y1="125" x2="500" y2="194" marker-end="url(#arrow)"/>
    <line x1="551" y1="125" x2="551" y2="194" marker-end="url(#arrow)"/>
    <line x1="602" y1="125" x2="602" y2="194" marker-end="url(#arrow)"/>
    <line x1="748" y1="125" x2="748" y2="194" marker-end="url(#arrow)"/>
    <line x1="799" y1="125" x2="799" y2="194" marker-end="url(#arrow)"/>
    <line x1="850" y1="125" x2="850" y2="194" marker-end="url(#arrow)"/>
  </g>

  <rect x="470" y="200" width="175" height="130" rx="10" fill="#f0f4f9" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="557" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Area A</text>
  <g fill="#e3eaf3" stroke="#9fb2c8" stroke-width="1">
    <rect x="484" y="240" width="70" height="26" rx="4"/>
    <rect x="562" y="240" width="70" height="26" rx="4"/>
    <rect x="484" y="274" width="70" height="26" rx="4"/>
    <rect x="562" y="274" width="70" height="26" rx="4"/>
  </g>
  <g font-size="10" fill="#33506e" text-anchor="middle">
    <text x="519" y="257">auth</text>
    <text x="597" y="257">web</text>
    <text x="519" y="291">data</text>
    <text x="597" y="291">infra</text>
  </g>

  <rect x="705" y="200" width="175" height="130" rx="10" fill="#f0f4f9" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="792" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Area B</text>
  <g fill="#e3eaf3" stroke="#9fb2c8" stroke-width="1">
    <rect x="719" y="240" width="70" height="26" rx="4"/>
    <rect x="797" y="240" width="70" height="26" rx="4"/>
    <rect x="719" y="274" width="70" height="26" rx="4"/>
    <rect x="797" y="274" width="70" height="26" rx="4"/>
  </g>
  <g font-size="10" fill="#33506e" text-anchor="middle">
    <text x="754" y="257">payments</text>
    <text x="832" y="257">search</text>
    <text x="754" y="291">batch</text>
    <text x="832" y="291">ops</text>
  </g>

  <text x="675" y="251" text-anchor="middle" font-size="10.5" fill="#b5471f">escalate</text>
  <line x1="649" y1="265" x2="701" y2="265" stroke="#b5471f" stroke-width="1.6" stroke-dasharray="5 4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>

  <text x="675" y="358" text-anchor="middle" font-size="12.5" fill="#1e7d46">primary every 3 weeks, half the system</text>
  <text x="675" y="376" text-anchor="middle" font-size="11" font-style="italic" fill="#1e7d46" opacity="0.85">knowledge diffuses across areas every few quarters</text>
</svg>
