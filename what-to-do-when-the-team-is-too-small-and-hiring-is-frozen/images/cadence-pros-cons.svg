<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" font-family="Helvetica, Arial, sans-serif">
  <title>Pros and cons of on-call more or less frequently</title>
  <desc>
    Two comparison cards.
    Left card, on-call more often, every three weeks over half the system: pros are context stays warm, relearn is four services not eight, incidents feel routine, a rhythm you can plan around; cons are nights disrupted twice as often, recovery window shrinks, project work interrupted regularly, unsustainable if shifts stay heavy.
    Right card, on-call less often, every six weeks over the whole system: pros are long uninterrupted project stretches, more recovery time after each shift, fewer lost nights per quarter; cons are five weeks of decay before every shift, every shift opens with a full relearn, responders act rusty at 3 a.m., one heavy shift costs days of reentry.
    A bottom band names the deciding variable: how heavy a single shift is, which territory size sets.
  </desc>
  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#ffffff"] { fill: #1b2029; }  /* cards, boxes */
      rect.svg-canvas { fill: #14191f; }  /* full canvas */
      [fill="#111"] { fill: #e2e8f0; }
      [fill="#14532d"] { fill: #86efac; }
      rect[fill="#14532d"],circle[fill="#14532d"],ellipse[fill="#14532d"],path[fill="#14532d"],polygon[fill="#14532d"] { fill: #2f8a52; }  /* keep white foreground */
      [fill="#1e7d46"] { fill: #5fcf8b; }
      rect[fill="#1e7d46"],circle[fill="#1e7d46"],ellipse[fill="#1e7d46"],path[fill="#1e7d46"],polygon[fill="#1e7d46"] { fill: #2f8a52; }  /* keep white foreground */
      [fill="#333"] { fill: #d1d5db; }
      [fill="#555"] { fill: #a8aeb5; }
      [fill="#7f1d1d"] { fill: #fca5a5; }
      rect[fill="#7f1d1d"],circle[fill="#7f1d1d"],ellipse[fill="#7f1d1d"],path[fill="#7f1d1d"],polygon[fill="#7f1d1d"] { fill: #c0524a; }  /* keep white foreground */
      [fill="#a12622"] { fill: #f29a94; }
      rect[fill="#a12622"],circle[fill="#a12622"],ellipse[fill="#a12622"],path[fill="#a12622"],polygon[fill="#a12622"] { fill: #c0524a; }  /* keep white foreground */
      [fill="#e8f4ec"] { fill: #122419; }
      [fill="#f0f4f9"] { fill: #20262f; }
      [fill="#f9ecea"] { fill: #2a1a1a; }
      [stroke="#1e7d46"] { stroke: #5fcf8b; }
      [stroke="#5b6b7c"] { stroke: #94a3b8; }
      [stroke="#a12622"] { stroke: #f29a94; }
      [stroke="#dddddd"] { stroke: #3a3f47; }
    }
  </style>

  <rect class="svg-canvas" x="0" y="0" width="920" height="490" fill="#ffffff"/>

  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">On-call cadence: what you gain and what you pay</text>

  <!-- left card: more often -->
  <rect x="30" y="50" width="420" height="48" rx="10" fill="#e8f4ec"/>
  <rect x="30" y="76" width="420" height="22" fill="#e8f4ec"/>
  <rect x="30" y="50" width="420" height="330" rx="10" fill="none" stroke="#1e7d46" stroke-width="1.5"/>
  <line x1="30" y1="98" x2="450" y2="98" stroke="#1e7d46" opacity="0.4"/>
  <text x="50" y="70" font-size="15" font-weight="bold" fill="#14532d">On-call more often</text>
  <text x="50" y="88" font-size="11.5" fill="#1e7d46">every 3 weeks, half the system</text>

  <text x="50" y="126" font-size="11" font-weight="bold" letter-spacing="2" fill="#1e7d46">PROS</text>
  <g>
    <circle cx="57" cy="146" r="7" fill="#1e7d46"/>
    <text x="57" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="72" y="150" font-size="12" fill="#333">context stays warm, never full-decay</text>
    <circle cx="57" cy="168" r="7" fill="#1e7d46"/>
    <text x="57" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="72" y="172" font-size="12" fill="#333">relearn is 4 services, not 8</text>
    <circle cx="57" cy="190" r="7" fill="#1e7d46"/>
    <text x="57" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="72" y="194" font-size="12" fill="#333">incidents feel routine, not novel</text>
    <circle cx="57" cy="212" r="7" fill="#1e7d46"/>
    <text x="57" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="72" y="216" font-size="12" fill="#333">a rhythm you can plan your life around</text>
  </g>

  <line x1="50" y1="232" x2="430" y2="232" stroke="#dddddd"/>
  <text x="50" y="258" font-size="11" font-weight="bold" letter-spacing="2" fill="#a12622">CONS</text>
  <g>
    <circle cx="57" cy="278" r="7" fill="#a12622"/>
    <text x="57" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="72" y="282" font-size="12" fill="#333">nights disrupted twice as often</text>
    <circle cx="57" cy="300" r="7" fill="#a12622"/>
    <text x="57" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="72" y="304" font-size="12" fill="#333">recovery window between shifts shrinks</text>
    <circle cx="57" cy="322" r="7" fill="#a12622"/>
    <text x="57" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="72" y="326" font-size="12" fill="#333">project work gets interrupted regularly</text>
    <circle cx="57" cy="344" r="7" fill="#a12622"/>
    <text x="57" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="72" y="348" font-size="12" fill="#333">unsustainable if shifts stay heavy</text>
  </g>

  <!-- right card: less often -->
  <rect x="470" y="50" width="420" height="48" rx="10" fill="#f9ecea"/>
  <rect x="470" y="76" width="420" height="22" fill="#f9ecea"/>
  <rect x="470" y="50" width="420" height="330" rx="10" fill="none" stroke="#a12622" stroke-width="1.5"/>
  <line x1="470" y1="98" x2="890" y2="98" stroke="#a12622" opacity="0.4"/>
  <text x="490" y="70" font-size="15" font-weight="bold" fill="#7f1d1d">On-call less often</text>
  <text x="490" y="88" font-size="11.5" fill="#a12622">every 6 weeks, the whole system</text>

  <text x="490" y="126" font-size="11" font-weight="bold" letter-spacing="2" fill="#1e7d46">PROS</text>
  <g>
    <circle cx="497" cy="146" r="7" fill="#1e7d46"/>
    <text x="497" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="512" y="150" font-size="12" fill="#333">long, uninterrupted project stretches</text>
    <circle cx="497" cy="168" r="7" fill="#1e7d46"/>
    <text x="497" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="512" y="172" font-size="12" fill="#333">more recovery time after each shift</text>
    <circle cx="497" cy="190" r="7" fill="#1e7d46"/>
    <text x="497" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <text x="512" y="194" font-size="12" fill="#333">fewer lost nights per quarter</text>
  </g>

  <line x1="490" y1="214" x2="870" y2="214" stroke="#dddddd"/>
  <text x="490" y="240" font-size="11" font-weight="bold" letter-spacing="2" fill="#a12622">CONS</text>
  <g>
    <circle cx="497" cy="260" r="7" fill="#a12622"/>
    <text x="497" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="512" y="264" font-size="12" fill="#333">5 weeks of decay before every shift</text>
    <circle cx="497" cy="282" r="7" fill="#a12622"/>
    <text x="497" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="512" y="286" font-size="12" fill="#333">every shift opens with a full relearn</text>
    <circle cx="497" cy="304" r="7" fill="#a12622"/>
    <text x="497" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="512" y="308" font-size="12" fill="#333">responders act rusty at 3 a.m.</text>
    <circle cx="497" cy="326" r="7" fill="#a12622"/>
    <text x="497" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">-</text>
    <text x="512" y="330" font-size="12" fill="#333">one heavy shift costs days of reentry</text>
  </g>

  <!-- deciding variable -->
  <rect x="30" y="400" width="860" height="64" rx="8" fill="#f0f4f9" stroke="#5b6b7c" stroke-width="1.2"/>
  <text x="460" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">The deciding variable: how heavy is a single shift?</text>
  <text x="460" y="446" text-anchor="middle" font-size="11.5" fill="#555">territory size sets it: half the system makes frequent shifts light enough to sustain, the whole system makes every frequency expensive.</text>
</svg>
