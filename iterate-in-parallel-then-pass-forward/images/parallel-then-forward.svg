<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" font-family="Helvetica, Arial, sans-serif">
  <title>Iterate in parallel, then pass forward</title>
  <desc>Phase 1 iterates requirements, specification, and component plan drafts in parallel around a loop, surfacing open questions into one central pool, repeating until a full pass adds no new questions. Phase 2 then settles the problem statement, requirements, specification, and plans and tests in one ordered forward pass that widens like a funnel.</desc>
  <defs>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5471f"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e7d46"/></marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a939e"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="380" fill="#ffffff"/>

  <text x="215" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5471f" letter-spacing="2">PHASE 1 · ITERATE IN PARALLEL</text>

  <path d="M 287.7 125.0 A 118 118 0 0 1 331.9 201.6" fill="none" stroke="#b5471f" stroke-width="2.2" marker-end="url(#arrOrange)"/>
  <path d="M 259.2 327.4 A 118 118 0 0 1 170.8 327.4" fill="none" stroke="#b5471f" stroke-width="2.2" marker-end="url(#arrOrange)"/>
  <path d="M 98.1 201.6 A 118 118 0 0 1 142.3 125.0" fill="none" stroke="#b5471f" stroke-width="2.2" marker-end="url(#arrOrange)"/>

  <line x1="215" y1="121" x2="215" y2="192" stroke="#767f8a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <line x1="256" y1="250" x2="240" y2="232" stroke="#767f8a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <line x1="174" y1="250" x2="190" y2="232" stroke="#767f8a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>

  <rect x="149" y="79" width="132" height="42" rx="9" fill="#ffffff" stroke="#33506e" stroke-width="1.5"/>
  <text x="215" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Requirements</text>
  <rect x="251.2" y="256" width="132" height="42" rx="9" fill="#ffffff" stroke="#33506e" stroke-width="1.5"/>
  <text x="317.2" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Component plans</text>
  <rect x="46.8" y="256" width="132" height="42" rx="9" fill="#ffffff" stroke="#33506e" stroke-width="1.5"/>
  <text x="112.8" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Specification</text>

  <rect x="140" y="195" width="150" height="46" rx="23" fill="#b5471f"/>
  <text x="215" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Open questions</text>

  <text x="215" y="352" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">repeat passes over every file at once</text>

  <text x="442" y="204" text-anchor="middle" font-size="12" font-style="italic" fill="#1e7d46">a full pass adds no new questions</text>
  <path d="M 340 218 H 545 Q 570 218 570 193 L 570 118 Q 570 93 595 93 H 705" fill="none" stroke="#1e7d46" stroke-width="2.6" marker-end="url(#arrGreen)"/>

  <text x="800" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e7d46" letter-spacing="2">PHASE 2 · ONE ORDERED PASS</text>

  <rect x="720" y="70" width="160" height="46" rx="9" fill="#eef7f1" stroke="#1e7d46" stroke-width="1.5"/>
  <text x="800" y="97.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Problem statement</text>
  <line x1="800" y1="116" x2="800" y2="130" stroke="#1e7d46" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="698" y="135" width="204" height="46" rx="9" fill="#eef7f1" stroke="#1e7d46" stroke-width="1.5"/>
  <text x="800" y="162.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Requirements</text>
  <line x1="800" y1="181" x2="800" y2="195" stroke="#1e7d46" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="672" y="200" width="256" height="46" rx="9" fill="#eef7f1" stroke="#1e7d46" stroke-width="1.5"/>
  <text x="800" y="227.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Specification</text>
  <line x1="800" y1="246" x2="800" y2="260" stroke="#1e7d46" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="650" y="265" width="300" height="46" rx="9" fill="#eef7f1" stroke="#1e7d46" stroke-width="1.5"/>
  <text x="800" y="292.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Plans and tests</text>

  <text x="800" y="352" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">each file settles before the next begins</text>
</svg>
