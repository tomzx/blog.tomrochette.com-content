<svg aria-labelledby="t" role="img" xmlns="http://www.w3.org/2000/svg" width="936" height="410" viewBox="-16 0 936 410" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The pull request queue with one human server</title>
  <desc>As the team adopts agents, pull requests arrive at generation speed while a single human reviews at a human rate. Arrival crosses service, the shaded queue grows without bound, and past the threshold reviews become skims and rubber stamps, and the rubber stamps merge.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="-16" y="0" width="936" height="410" fill="#ffffff"/>
<line x1="90" y1="60" x2="90" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="90" y1="310" x2="790" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
<text x="78" y="74" text-anchor="end" font-size="12" fill="#64748b">PRs per day</text>
<text x="440.0" y="346" text-anchor="middle" font-size="12" fill="#64748b">time, as the team adopts agents</text>
<path d="M 90 270 L 510.0 140 L 790 110" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="782" y="100" text-anchor="end" font-size="13" fill="#dc2626">opened at generation speed</text>
<line x1="90" y1="230" x2="790" y2="230" stroke="#16a34a" stroke-width="2.5"/>
<text x="782" y="220" text-anchor="end" font-size="13" fill="#16a34a">reviewed by one human at a human rate</text>
<rect x="265.0" y="118" width="525.0" height="112" fill="#fbe9e9" opacity="0.55"/>
<text x="524.0" y="170.0" text-anchor="middle" font-size="12" font-style="italic" fill="#dc2626">the queue grows without bound</text>
<text x="440.0" y="374" text-anchor="middle" font-size="12" fill="#64748b">past the threshold, reviews are skims and rubber stamps, and the rubber stamps merge</text>
</svg>
