<svg aria-labelledby="t" role="img" xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Anger as a tactic and its break condition</title>
  <desc>An angry outburst makes the target read the volume as a hard limit and infer the opponent will not move. If the target cannot walk away, the target concedes and the tactic pays. If the target has power, the target retaliates and demands more, and the tactic backfires.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker markerUnits="userSpaceOnUse" id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="320" fill="#ffffff"/>
<rect x="40" y="116" width="240" height="88" rx="8" fill="#fbe9e9" stroke="#dc2626" stroke-width="1.5"/>
<text x="160" y="146.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#0f172a">An angry outburst lands</text>
<text x="160" y="168" text-anchor="middle" font-size="12" fill="#64748b">the volume reads as a hard limit</text>
<text x="160" y="186" text-anchor="middle" font-size="12" fill="#64748b">target infers no movement</text>
<line x1="280" y1="160" x2="360" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="360" y1="100" x2="360" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="360" y1="100" x2="394" y2="100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="400" y="58" width="480" height="84" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<rect x="400" y="58" width="480" height="34" rx="8" fill="#e7f6ed" stroke="#16a34a" stroke-width="1.5"/>
<rect x="401" y="84" width="478" height="8" fill="#e7f6ed" stroke="none"/>
<text x="640.0" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Target cannot walk away</text>
<circle cx="418" cy="110" r="2.5" fill="#16a34a"/>
<text x="428" y="114.0" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">Concedes. The tactic pays.</text>
<text x="860" y="100" text-anchor="end" font-size="11" font-style="italic" fill="#16a34a">the tactic works</text>
<line x1="360" y1="220" x2="394" y2="220" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="400" y="178" width="480" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<rect x="400" y="178" width="480" height="34" rx="8" fill="#fbe9e9" stroke="#dc2626" stroke-width="1.5"/>
<rect x="401" y="204" width="478" height="8" fill="#fbe9e9" stroke="none"/>
<text x="640.0" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Target has power</text>
<circle cx="418" cy="230" r="2.5" fill="#dc2626"/>
<text x="428" y="234.0" text-anchor="start" font-size="13" font-weight="normal" fill="#0f172a">Retaliates and demands more. The tactic backfires.</text>
<text x="860" y="220" text-anchor="end" font-size="11" font-style="italic" fill="#dc2626">the tactic backfires</text>
</svg>
