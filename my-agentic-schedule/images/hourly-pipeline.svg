<svg viewBox="0 0 800 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The pipeline the three hourly runs share</title>
  <desc id="d">An every-hour clock fans into three lanes, review-requested-prs, handle-failing-pr-ci, and triage-pr-feedback. Each lane runs a discovery script, then one agent per pull request, then produces an output: verdict reports, green CI, or recommendations. All three outputs converge on a decision node labeled Me.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="420" y="36" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">The pipeline the three hourly runs share</text>

  <!-- Clock -->
  <circle cx="60" cy="64" r="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <line x1="60" y1="64" x2="60" y2="57.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="64" x2="65.5" y2="64" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="68" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">every hour</text>

  <!-- Spine from clock down to the three lanes -->
  <line x1="60" y1="79" x2="60" y2="358" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Branch arrows into each lane's discovery box -->
  <line x1="64" y1="134" x2="85" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="64" y1="246" x2="85" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="64" y1="358" x2="85" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lane 1: review-requested-prs -->
  <text x="96" y="84" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">review-requested-prs</text>
  <rect x="96" y="96" width="180" height="76" rx="8" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="186" y="124" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Discovery script</text>
  <text x="186" y="145" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">my reviewer queue,</text>
  <text x="186" y="163" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">steps stale vs HEAD</text>
  <line x1="281" y1="134" x2="297" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="308" y="96" width="190" height="76" rx="8" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="403" y="124" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Agent per PR</text>
  <text x="403" y="145" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">risk, coverage,</text>
  <text x="403" y="163" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">validate, verify, craft</text>
  <line x1="503" y1="134" x2="519" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="96" width="160" height="76" rx="8" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="124" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Verdict reports</text>
  <text x="610" y="145" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">keyed to the commit</text>
  <line x1="695" y1="134" x2="711" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lane 2: handle-failing-pr-ci -->
  <text x="96" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">handle-failing-pr-ci</text>
  <rect x="96" y="208" width="180" height="76" rx="8" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="186" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Discovery script</text>
  <text x="186" y="257" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">my PRs with</text>
  <text x="186" y="275" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">failing checks</text>
  <line x1="281" y1="246" x2="297" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="308" y="208" width="190" height="76" rx="8" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="403" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Agent per PR</text>
  <text x="403" y="257" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">smallest fix,</text>
  <text x="403" y="275" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">two tries, then stop</text>
  <line x1="503" y1="246" x2="519" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="208" width="160" height="76" rx="8" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Green CI</text>
  <text x="610" y="257" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">watched to green</text>
  <line x1="695" y1="246" x2="711" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lane 3: triage-pr-feedback -->
  <text x="96" y="308" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">triage-pr-feedback</text>
  <rect x="96" y="320" width="180" height="76" rx="8" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="186" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Discovery script</text>
  <text x="186" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">new unresolved</text>
  <text x="186" y="387" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">reviewer comments</text>
  <line x1="281" y1="358" x2="297" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="308" y="320" width="190" height="76" rx="8" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="403" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Agent per PR</text>
  <text x="403" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">read-only, one file</text>
  <text x="403" y="387" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">per new comment</text>
  <line x1="503" y1="358" x2="519" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="320" width="160" height="76" rx="8" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Recommendations</text>
  <text x="610" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">await my decision</text>
  <line x1="695" y1="358" x2="711" y2="358" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Me: the decision node -->
  <rect x="722" y="96" width="68" height="300" rx="8" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="2"/>
  <text x="756" y="242" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8" text-anchor="middle">Me</text>
  <text x="756" y="260" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">decides</text>
</svg>
